<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="dashboard.css" rel="stylesheet">
    <script src="dashboard.js" defer></script>
</head>
<body>
    <div class= "mainContainer">
        <div class= "sidebar">
            <div class="sTitle">
                <img src="Images/sidebar_icons/icons8-dashboard-48.png" alt="Dashboard_Image">                
                <h1>Dashboard</h1>
            </div>
            <div class="sContent1">
                <img class = "subIcons" src="Images/sidebar_icons/icons8-home-50.png" alt="An image of a house">
                <h2>Home</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-profile-26.png" alt="An image of a blank profile">
                <h2>Profile</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-speech-bubble-26.png" alt="An image of a message bubble">
                <h2>Messages</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-clock-52.png" alt="An image of a clock">
                <h2>History</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-to-do-list-52.png" alt="An image of a to-do list">
                <h2>Tasks</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-community-52.png" alt="An image of a group of people">
                <h2>Communities</h2>
            </div>
            <div class="sContent2">
                <img class = "subIcons" src="Images/sidebar_icons/icons8-gear-52.png" alt="An image of a house">                
                <h2>Settings</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-support-52.png" alt="An image of a house">                
                <h2>Support</h2>
                <img class = "subIcons" src="Images/sidebar_icons/icons8-user-shield-52.png" alt="An image of a house">                
                <h2>Privacy</h2>
            </div>
        </div>
        <div class= "header">
            <div class="search">
                    <img class="searchImg" src="Images/header_icons/icons8-magnifying-glass-52.png" alt="Magnifying Glass">
                    <input id = "searchQuery" name="searchQuery" class="text">
                <div class="miniProfile">
                    <img class ="bell" src="Images/header_icons/notification-bell-ring-1.png" alt="Notifcation Bell">               
                    <img class= "pfp" src="Images/header_icons/Walta.jpg" alt="Your Profile Picture">
                </div>                    
            </div>
            <div class="greeting">

            </div>
        </div>
        <div class="subContainer">
            <div class= "projectContainer"></div>
            <div class= "announcements"></div>
            <div class= "trending"></div> 
        </div>

    </div>

</body>
</html>
